services:
  db:
    image: postgres:16-alpine
    container_name: oja-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # map host 5433 → container 5432 (avoid conflict with local Postgres)
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - oja-network

  api:
    build:
      context: .
      dockerfile: oja-backend/Dockerfile
    container_name: oja-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    command: >
      sh -c "alembic upgrade head &&
              fastapi run --entrypoint src.main:app --host 0.0.0.0 --port 8000"
    networks:
      - oja-network

  app:
    build:
      context: .
      dockerfile: oja-app/Dockerfile
    container_name: oja-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5173}:5173"
    env_file:
      - .env
    networks:
      - oja-network

  storefront:
    build:
      context: .
      dockerfile: oja-storefront/Dockerfile
    container_name: oja-storefront
    restart: unless-stopped
    ports:
      - "${STOREFRONT_PORT:-5174}:5174"
    env_file:
      - .env
    networks:
      - oja-network

volumes:
  postgres_data:
    name: oja-db-data
  alloy_positions:

networks:
  oja-network:
    driver: bridge